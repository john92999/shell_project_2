apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-ui
  namespace: todo-app
  labels:
    app: todo-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-ui
  template:
    metadata:
      labels:
        app: todo-ui
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: todo-ui
          image: 730335252201.dkr.ecr.ap-south-1.amazonaws.com/todo-ui:1.0.0
          imagePullPolicy: Always
          # Override the default CMD which tries to run env.sh (not in image)
          # env-config.js is already injected via ConfigMap mount below
          # so we just start nginx directly
          command: ["/bin/sh", "-c"]
          args: ["nginx -g 'daemon off;'"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: env-config-volume
              mountPath: /usr/share/nginx/html/env-config.js
              subPath: env-config.js
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: env-config-volume
          configMap:
            name: todo-ui-env-config
        - name: nginx-config-volume
          configMap:
            name: todo-ui-nginx-config
