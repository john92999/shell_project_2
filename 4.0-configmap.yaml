apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-api-config
  namespace: todo-app
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/tododb"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update" # auto-creates the todos table on startup
  SPRING_JPA_SHOW_SQL: "false" # set to "true" to debug SQL queries
  SERVER_PORT: "8080"
